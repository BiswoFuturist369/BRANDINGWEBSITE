<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>URBrand 360 | Where Vision Meets Strategy</title>

    <!-- Google Fonts: DM Serif Display, Instrument Serif, Inter Tight, Space Mono -->

    <!-- Organization JSON-LD -->

        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "URBrand 360",
        "url": "https://urbrand360.com",
        "logo": "https://urbrand360.com/logo/urbrand360-logo-dark.png",

        "areaServed": "Worldwide",
        "founder": {
          "@type": "Person",
          "name": "Vaishnavi Ahuja",
          "jobTitle": "Founder & CEO"

        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Indore",
          "addressRegion": "Madhya Pradesh",
          "addressCountry": "India"
        }
      }
    </script>
  </head>
  <body class="bg-[#FFFFFF] text-[#0A0A0A] selection:bg-[#E11D2A] selection:text-[#FFFFFF] antialiased overflow-x-clip">
