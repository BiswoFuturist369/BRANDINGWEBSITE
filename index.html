<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>URBrand 360 | Where Vision Meets Strategy</title>
    <meta name="description" content="Global branding, marketing, consulting, ecommerce, tax and AI automation studio." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://urbrand360.com/" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbrand360.com/" />
    <meta property="og:title" content="URBrand 360 | Where Vision Meets Strategy" />
    <meta property="og:description" content="Global branding, marketing, consulting, ecommerce, tax and AI automation studio." />
    <meta property="og:image" content="https://urbrand360.com/logo/urbrand360-logo-dark.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://urbrand360.com/" />
    <meta name="twitter:title" content="URBrand 360 | Where Vision Meets Strategy" />
    <meta name="twitter:description" content="Global branding, marketing, consulting, ecommerce, tax and AI automation studio." />
    <meta name="twitter:image" content="https://urbrand360.com/logo/urbrand360-logo-dark.png" />

    <!-- Performance & Preloads: High Priority LCP Poster & Logo -->
    <link rel="preload" as="image" href="/video/urbrand360-reel-poster-mobile.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/video/urbrand360-reel-poster.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo/urbrand360-emblem-dark-sm.webp" type="image/webp" />

    <!-- Google Fonts: Non-render-blocking asynchronous load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" />
    </noscript>

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "URBrand 360",
        "url": "https://urbrand360.com",
        "logo": "https://urbrand360.com/logo/urbrand360-logo-dark.png",
        "description": "Global branding, marketing, consulting, ecommerce, tax and AI automation studio.",
        "areaServed": "Worldwide",
        "founder": {
          "@type": "Person",
          "name": "Vaishnavi Ahuja",
          "jobTitle": "Founder & CEO"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Indore",
          "addressRegion": "Madhya Pradesh",
          "addressCountry": "India"
        }
      }
    </script>
  </head>
  <body class="bg-[#FFFFFF] text-[#0A0A0A] selection:bg-[#E11D2A] selection:text-[#FFFFFF] antialiased overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
